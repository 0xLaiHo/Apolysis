name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v0.3.0
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: linux x86_64 release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APOLYSIS_RELEASE_TARGET: x86_64-unknown-linux-gnu
      APOLYSIS_RELEASE_BINARY: target/release/apolysis
      APOLYSIS_RELEASE_DAEMON_BINARY: target/release/apolysisd
      APOLYSIS_RELEASE_HEALTH_BINARY: target/release/apolysisd-health
      APOLYSIS_RELEASE_BPF_OBJECT: target/ebpf/apolysis_observer.bpf.o
      APOLYSIS_RELEASE_SYSTEMD_UNIT: deploy/systemd/apolysisd.service
      APOLYSIS_RELEASE_OUTPUT_DIR: target/release-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install release build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev linux-tools-common linux-tools-generic
          if ! bpftool version >/dev/null 2>&1; then
            bpftool_path="$(find /usr/lib/linux-tools* -type f -name bpftool | sort -V | tail -n 1)"
            [[ -n "$bpftool_path" ]]
            sudo ln -sf "$bpftool_path" /usr/local/bin/bpftool
            hash -r
          fi
          bpftool version

      - name: Build userspace binaries
        run: |
          cargo build --release -p apolysis-cli --bin apolysis
          cargo build --release -p apolysis-daemon --bins
          cargo build --release -p apolysis-release-verifier

      - name: Build CO-RE BPF object
        run: |
          APOLYSIS_REQUIRE_BPF=1 make build-ebpf
          test -s "$APOLYSIS_RELEASE_BPF_OBJECT"

      - name: Test release packaging contract
        run: make test-release-artifacts

      - name: Package release artifacts
        env:
          WORKFLOW_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            release_version="$GITHUB_REF_NAME"
          else
            release_version="$WORKFLOW_RELEASE_VERSION"
          fi
          [[ -n "$release_version" ]]
          APOLYSIS_RELEASE_VERSION="$release_version" ./scripts/package-release-artifacts.sh

      - name: Verify generated release artifacts
        run: make verify-release-artifacts

      - name: Upload release artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: apolysis-linux-x86_64-release-artifacts
          path: target/release-artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload assets to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_version="$GITHUB_REF_NAME"
          package="target/release-artifacts/apolysis-${release_version}-${APOLYSIS_RELEASE_TARGET}.tar.gz"
          checksum="${package}.sha256"
          manifest="target/release-artifacts/apolysis-release-manifest.json"
          if ! gh release view "$release_version" >/dev/null 2>&1; then
            gh release create "$release_version" \
              --title "$release_version" \
              --notes "Apolysis $release_version"
          fi
          assets=("$package" "$checksum" "$manifest")
          gh release upload "$release_version" "${assets[@]}" --clobber
