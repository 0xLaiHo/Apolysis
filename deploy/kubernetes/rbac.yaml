# SPDX-License-Identifier: Apache-2.0
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apolysis-kubernetes-source
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: apolysis-kubernetes-source
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: apolysis-kubernetes-source
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: apolysis-kubernetes-source
subjects:
  - kind: ServiceAccount
    name: apolysis-kubernetes-source
