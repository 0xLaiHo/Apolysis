[package]
name = "apolysis-kubernetes-source"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
apolysis-core = { path = "../apolysis-core" }
k8s-openapi = { version = "0.28", features = ["v1_36"] }
kube = { version = "4.2", default-features = false, features = ["client", "ring", "rustls-tls"] }
http = "1"
http-body-util = "0.1"
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid.workspace = true
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "apolysis-kubernetes-source"
path = "src/main.rs"
